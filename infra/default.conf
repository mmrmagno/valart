# Keep in step with src/lib/bots.ts. robots.txt, llms.txt and ai.txt stay readable so they can see the rule.
map $http_user_agent $ai_bot {
    default 0;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|Claude-Web|anthropic-ai|CCBot|GoogleOther|Bytespider|PerplexityBot|Perplexity-User|Amazonbot|meta-externalagent|meta-externalfetcher|FacebookBot|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgili|YouBot|Timpibot|AI2Bot|Ai2Bot-Dolma|PanguBot|DuckAssistBot|MistralAI-User|Webzio-Extended|img2dataset|Scrapy)" 1;
}

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.inc;

    location ~ ^/(robots|llms|ai)\.txt$ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        if ($ai_bot) {
            return 403;
        }
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ ^/(_assets|fonts)/ {
        if ($ai_bot) {
            return 403;
        }
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
